        (function populateStateDropdown() {
        const select = document.getElementById('stateFilter');
        const states = new Set();

    allFeatures.forEach(feature => {
        const s = feature.properties.State;
        if (s && s.trim() !== '') {
            states.add(s);
        }
    });

    Array.from(states)
        .sort((a, b) => a.localeCompare(b))
        .forEach(state => {
            const option = document.createElement('option');
            option.value = state;
            option.textContent = state;
            select.appendChild(option);

       (function populateTypeCheckboxes() {
    const container = document.getElementById('typeOptions');

    // Create sub-containers
    const hotelSection = document.createElement('div');
    const restaurantSection = document.createElement('div');

    hotelSection.innerHTML = '<strong>Hotels</strong>';
    restaurantSection.innerHTML = '<strong>Restaurants</strong>';

    const hotelTypes = new Set();
    const restaurantTypes = new Set();

    function isHotelType(type) {
        return /^[A-Z]/.test(type) && /\(.*\)/.test(type);
    }

    allFeatures.forEach(feature => {
        const t = feature.properties.Type;
        if (!t || t.trim() === '') return;

        if (isHotelType(t)) {
            hotelTypes.add(t);
        } else {
            restaurantTypes.add(t);
        }
    });

    function addCheckbox(type, target) {
        const label = document.createElement('label');
        label.style.display = 'block';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = type;
        checkbox.checked = true;
        checkbox.className = 'type-filter';

        checkbox.addEventListener('change', applyFilters);

        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(' ' + type));
        target.appendChild(label);
    }

    Array.from(hotelTypes).sort().forEach(t => addCheckbox(t, hotelSection));
    Array.from(restaurantTypes).sort().forEach(t => addCheckbox(t, restaurantSection));

    container.appendChild(hotelSection);
    container.appendChild(document.createElement('br'));
    container.appendChild(restaurantSection);
})();

        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }

function renderFilteredData(filters) {

        const hrType = feature.properties.Restaurant_Hotel;

            (!filters.showRestaurant && hrType === "Restaurant")
        ) return;

        // ───────── Type filter ─────────
        if (filters.types && filters.types.length > 0) {
            if (!filters.types.includes(feature.properties.Type)) return;
        }
        // ───────── State filter ─────────
        if (filters.state && feature.properties.State !== filters.state) return;


        // ───────── Create marker ─────────
        var lat = feature.geometry.coordinates[1];
        var lng = feature.geometry.coordinates[0];

        [lat, lng],

        icon: isHotel ? hotelIcon : restaurantIcon

        filteredLayer.addLayer(marker);


        // ───────── Collect bounds for visible points ─────────
        bounds.push(marker.getLatLng());

        // ───────── Collect bounds ONLY for city zoom ─────────
        if (
            filters.city &&
            feature.properties.City &&
            feature.properties.City.toLowerCase().includes(filters.city.toLowerCase())

            cityBounds.push(marker.getLatLng());
        }

        map.fitBounds(cityBounds, { padding: [40, 40] });
    } else if (bounds.length === 1) {
        map.setView(bounds[0], 14);
    } else if (bounds.length > 1) {
        map.fitBounds(bounds, { padding: [40, 40] });
    }
}

function applyFilters() {
    const city = document.getElementById('cityFilter').value.trim();
    const state = document.getElementById('stateFilter').value;

    const showHotel = document.getElementById('filterHotel').checked;
    const showRestaurant = document.getElementById('filterRestaurant').checked;

    const selectedTypes = Array.from(
        document.querySelectorAll('.type-filter:checked')
    ).map(cb => cb.value);

    renderFilteredData({
        city: city || null,
        state: state || null,
        showHotel: showHotel,
        showRestaurant: showRestaurant,
        types: selectedTypes
    });
}


    
    document.getElementById('cityFilter').addEventListener('input', function () {
    applyFilters();
    });
    document.getElementById('stateFilter').addEventListener('change', applyFilters);

    document.getElementById('filterHotel').addEventListener('change', applyFilters);
    document.getElementById('filterRestaurant').addEventListener('change', applyFilters);
    
    document.getElementById('typeToggle').addEventListener('click', function () {
    const box = document.getElementById('typeOptions');
    const open = box.style.display === 'block';

    box.style.display = open ? 'none' : 'block';
    this.textContent = (open ? '▶' : '▼') + ' Type';
    });
